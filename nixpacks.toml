[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[variables]
NODE_ENV = "production"
PYTHON_BIN = "python3"

[phases.install]
cmds = [
  "python3 -m pip install --no-cache-dir -r requirements.txt",
  "npm ci --include=dev --prefix backend"
]

[phases.build]
cmds = [
  "npm --prefix backend run build"
]

[start]
cmd = "node backend/dist/server.js"
